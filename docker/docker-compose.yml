version: '3.8'

services:
  # AI Microservice (FastAPI)
  ai-service:
    build:
      context: ../backend/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - SUPABASE_URL=http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Online Judge Worker (Local Sandbox Container)
  judge-worker:
    build:
      context: ../backend/judge
      dockerfile: Dockerfile
    environment:
      - WORKER_ENV=development
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy}
      - POLL_INTERVAL_SECONDS=1.0
      - MAX_CPU_TIME_SECONDS=2.0
      - MAX_MEMORY_MB=256
      - MAX_CONCURRENT_JOBS=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
